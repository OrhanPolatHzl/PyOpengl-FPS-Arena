name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pyimgui.txt
      - name: Syntax check
        run: python -m compileall -q main.py tests
      - name: Unit tests (no GPU required)
        run: python -m unittest discover -s tests -v
